<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — 페이지를 찾을 수 없습니다 · Git Science Park</title>
  <link rel="icon" type="image/svg+xml" href="https://denny-hwang.github.io/git-science-park/favicon.svg" />
  <style>
    :root {
      --bg: #0e1320;
      --bg-card: #1b2336;
      --border: #2b3550;
      --text: #e7ecf5;
      --text-muted: #9aa6bf;
      --accent: #5b9dff;
      --accent-soft: rgba(91, 157, 255, 0.16);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(91, 157, 255, 0.10), transparent 60%),
        radial-gradient(900px 500px at -10% 10%, rgba(107, 70, 193, 0.10), transparent 55%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 560px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.38);
    }
    .emoji { font-size: 3rem; }
    h1 { margin: 12px 0 4px; font-size: 1.6rem; }
    .en { color: var(--text-muted); font-size: 0.95rem; margin: 0 0 16px; }
    p.desc { color: var(--text-muted); font-size: 0.95rem; margin: 0 0 24px; }
    a.btn {
      display: inline-block;
      background: var(--accent);
      color: #0b1220;
      font-weight: 700;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 26px;
      transition: transform 0.16s, box-shadow 0.16s;
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 0 0 4px var(--accent-soft); }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="box">
    <div class="emoji" aria-hidden="true">🔭</div>
    <h1>404 — 페이지를 찾을 수 없습니다</h1>
    <p class="en">Page not found</p>
    <p class="desc">
      찾으시는 실험이 이동했거나 주소가 잘못 입력되었을 수 있습니다.<br />
      허브에서 70개 실험을 검색해 보세요.<br />
      <span lang="en">The experiment may have moved. Try searching from the hub.</span>
    </p>
    <a class="btn" href="https://denny-hwang.github.io/git-science-park/">🧪 실험실 허브로 (Back to the hub)</a>
  </main>
</body>
</html>
